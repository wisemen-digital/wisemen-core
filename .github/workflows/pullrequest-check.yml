---
name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']

jobs:
  lint-build-test:
    uses: wisemen-digital/devops-github-actions/.github/workflows/web-build-and-test.yml@main
    if: github.event.pull_request.draft == false && github.head_ref != 'changeset-release/main'
    with:
      test-timeout: 10
    secrets: inherit

  api-packages-tests:
    name: Test changed API packages
    if: github.event.pull_request.draft == false && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TURBO_API: https://cache.turbo.internal.appwi.se
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ github.event.repository.name }}
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test changed API packages
        run: pnpm turbo run test --force --filter='{./packages/api/**}...[origin/main]'

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    container_name: postgres-wisemen-core
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db

  redis:
    image: redis:7-alpine
    container_name: redis-wisemen-core
    ports:
      - '6379:6379'

volumes:
  postgres-data:

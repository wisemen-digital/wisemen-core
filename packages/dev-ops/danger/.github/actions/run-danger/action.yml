name: 'Danger Runner'
description: 'Runs Danger JS with reusable rules configuration'
inputs:
  github-access-token:
    description: GitHub access token (GITHUB_TOKEN)
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install @wisemen/danger (if not already in dependencies)
      shell: bash
      run: |
        # Check if @wisemen/danger is already installed via pnpm
        if ! pnpm list @wisemen/danger >/dev/null 2>&1; then
          pnpm add @wisemen/danger
        fi
    - name: Run Danger
      shell: bash
      run: pnpm exec danger ci --dangerfile ${{ github.action_path }}/dangerfile.ts
      env:
        GITHUB_TOKEN: ${{ inputs.github-access-token }}

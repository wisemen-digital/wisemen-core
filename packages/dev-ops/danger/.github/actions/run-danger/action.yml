name: 'Danger Runner'
description: 'Runs Danger JS with reusable rules configuration'
inputs:
  github-access-token:
    description: GitHub access token (GITHUB_TOKEN)
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install wisemen-danger-rules (if not already in dependencies)
      shell: bash
      run: |
        # Check if wisemen-danger-rules is already installed via pnpm
        if ! pnpm list wisemen-danger-rules >/dev/null 2>&1; then
          pnpm add wisemen-danger-rules
        fi
    - name: Run Danger
      shell: bash
      run: danger ci --dangerfile ${{ github.action_path }}/dangerfile.ts
      env:
        GITHUB_TOKEN: ${{ inputs.github-access-token }}

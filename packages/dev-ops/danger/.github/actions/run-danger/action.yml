name: 'Danger Runner'
description: 'Runs Danger JS with reusable rules configuration'
inputs:
  github-access-token:
    description: GitHub access token (GITHUB_TOKEN)
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install @wisemen/danger (if not already in dependencies)
      shell: bash
      run: |
        # danger's CLI bin must be a direct dependency of the consumer project -
        # pnpm only links bins for direct deps into node_modules/.bin, so
        # pnpm exec can't find it if it's only a transitive dep of @wisemen/danger.
        if ! pnpm list @wisemen/danger >/dev/null 2>&1; then
          pnpm add danger @wisemen/danger
        fi
    - name: Run Danger
      shell: bash
      run: pnpm exec danger ci --dangerfile ${{ github.action_path }}/dangerfile.ts
      env:
        GITHUB_TOKEN: ${{ inputs.github-access-token }}

<style>

   * Storybook hardcodes a few blues that theming's create() doesn't expose;
   * recolor them to the design system's brand purple (theme.css --brand-500/600).
   */

  /* Sidebar row hover/focus (defaults to #233952) */
  #storybook-explorer-tree .sidebar-item:hover,
  #storybook-explorer-tree .sidebar-item:focus {
    --tree-node-background-hover: #22262f !important;
  }

  /* Sidebar section action buttons pressed state (defaults to #233952) */
  .sidebar-subheading-action:active {
    background: rgba(127, 86, 217, 0.2) !important;
  }

  /* Addon tab count badge (defaults to #233952) */
  [role='tab'] > div > div {
    background: rgba(127, 86, 217, 0.2) !important;
  }
</style>
